version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: verso
      POSTGRES_PASSWORD: verso
    volumes:
      - verso_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      DATABASE_URL: postgres://verso:verso@db:5432/verso
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - verso_media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000/api"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  verso_pgdata:
  verso_media:
